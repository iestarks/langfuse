name: Security - Detect Secrets

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly full-history sweep (Mondays ~04:37 UTC) — org baseline from USEA /
    # Hashicorp-Azure-LLM #77.
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TRUFFLEHOG_VERSION: v3.97.1

jobs:
  secret-detection:
    runs-on: ubuntu-latest
    name: Detect Exposed Secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned TruffleHog
        run: |
          curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
            | sh -s -- -b /usr/local/bin "${TRUFFLEHOG_VERSION}"
          trufflehog --version

      # Blocking scan over EVERY file type (no extension allowlists):
      # catches *.tfstate, *.json, *.tf, *.hcl etc.
      - name: TruffleHog filesystem scan (blocking)
        run: |
          set +e
          trufflehog filesystem . --no-update --json > /tmp/trufflehog-findings.json
          rc=$?
          count=$(jq -s 'length' /tmp/trufflehog-findings.json 2>/dev/null || echo "?")
          echo "TruffleHog findings: ${count}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::TruffleHog detected secrets in the working tree!"
            jq -r '[.SourceMetadata.Data.Filepath // "?", .DetectorName // "?"] | @tsv' \
              /tmp/trufflehog-findings.json 2>/dev/null | sort -u | head -20
            exit 1
          fi

      # Blocking high-signal grep gate across ALL text files (-I, no include allowlists).
      - name: Check for common secret patterns (blocking)
        run: |
          set +e
          hits=$(grep -rInE \
            'DefaultEndpointsProtocol=https|AccountKey=[A-Za-z0-9+/]{40,}|-----BEGIN (RSA |EC |OPENSSH |PGP |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{40,}|sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|whsec_[A-Za-z0-9]{10,}' \
            . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            --exclude-dir=.terraform --exclude-dir=vendor --exclude-dir=__pycache__ \
            --exclude-dir=.next --exclude-dir=dist --exclude-dir=findings \
            --exclude=*.example --exclude=*.sample --exclude=*.template \
            --exclude=security-detect-secrets.yml \
            2>/dev/null \
            | grep -viE 'EXAMPLE|placeholder|REPLACE_ME|CHANGE_ME|REDACTED|your[-_]|example\.com|example\.org|AKIA1234567890ABCDEF|\$\{[A-Za-z_][A-Za-z0-9_]*\}')
          if [ -n "$hits" ]; then
            echo "::error::Potential secrets matched high-confidence patterns:"
            echo "$hits" | head -20
            exit 1
          fi
          echo "No high-signal secret patterns found."

      - name: Verify .env is gitignored
        run: |
          if git ls-files | grep -E '^\.env(\.|$)' | grep -Ev '\.(example|sample|template)$'; then
            echo "ERROR: real .env files are tracked in git!" && exit 1
          fi
          echo ".env hygiene OK"

      - name: Upload scan results artifact (audit evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.run_id }}
          path: /tmp/trufflehog-findings.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Forward finding to siem-soar hub
        if: failure()
        env:
          HUB_TOKEN: ${{ secrets.SIEM_SOAR_HUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "SIEM_SOAR_HUB_TOKEN not configured; central escalation will pick this up via scheduled audit."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $HUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/iestarks/siem-soar/dispatches \
            -d "{\"event_type\":\"soar_finding\",\"client_payload\":{\"source_repo\":\"$REPO\",\"finding_type\":\"secret_exposure\",\"run_url\":\"$RUN_URL\"}}"

      - name: Create security scan summary
        if: always()
        run: |
          {
            echo "## 🔒 Security - Secret Detection"
            echo ""
            echo "- TruffleHog filesystem scan (all file types): ${{ job.status }}"
            echo "- High-signal grep gate (all text files)"
            echo "- .env gitignore verification"

  # Non-gated visibility job: scans ENTIRE git history so leaks that were added
  # AND removed between scanner introductions are still surfaced.
  history-sweep:
    runs-on: ubuntu-latest
    name: Full Git History Sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned TruffleHog
        run: |
          curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
            | sh -s -- -b /usr/local/bin "${TRUFFLEHOG_VERSION}"

      - name: Scan entire git history
        run: |
          set +e
          trufflehog git "file://${GITHUB_WORKSPACE}" --no-update --json > /tmp/history-findings.json
          rc=$?
          count=$(jq -s 'length' /tmp/history-findings.json 2>/dev/null || echo "?")
          echo "TruffleHog historical findings: ${count}"

          git_grep_hits=$(git log --all -p --no-color \
            | grep -aInE 'AccountKey=[A-Za-z0-9+/]{40,}|-----BEGIN (RSA |EC |OPENSSH |PGP |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}' \
            | grep -aviE 'EXAMPLE|placeholder|REPLACE_ME|AKIA1234567890ABCDEF' | head -10)
          echo "Git-history grep findings: ${git_grep_hits:-0}"

          if [ "$rc" -ne 0 ] || [ -n "$git_grep_hits" ]; then
            echo "::warning::Secrets exist in GIT HISTORY. Rotate the credentials, then purge with git filter-repo."
            jq -r '[.SourceMetadata.Data.Filepath // "?", .DetectorName // "?"] | @tsv' \
              /tmp/history-findings.json 2>/dev/null | sort -u | head -30
            [ -n "$git_grep_hits" ] && printf '%s\n' "$git_grep_hits"
            exit 1
          fi
          echo "✅ Full history clean"

          } >> "$GITHUB_STEP_SUMMARY"
